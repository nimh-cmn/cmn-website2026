{% extends "base.html" %}
{% block title %}{{ title }} | {{ SITENAME }}{% endblock %}
{% block content %}
<article class="page">
  <header class="page-header">
    <p class="eyebrow">{{ short_name }}</p>
    <h1>{{ title }}</h1>
    {% if summary %}<p>{{ summary|striptags }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  {% if external_url %}
  <p><a class="button" href="{{ external_url }}">Visit {{ short_name }}</a></p>
  {% endif %}
</article>
{% endblock %}
