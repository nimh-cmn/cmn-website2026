<article class="software-card">
  <p class="eyebrow">{{ tool.group|upper }}</p>
  <h3>
    {% if tool.external_url %}
    <a href="{{ tool.external_url }}">{{ tool.title }}</a>
    {% else %}
    <a href="{{ SITEURL }}{{ tool.url }}">{{ tool.title }}</a>
    {% endif %}
  </h3>
  {% if tool.summary %}<p>{{ tool.summary|striptags }}</p>{% endif %}
  {% if tool.maintainer %}<p class="meta">Maintainer: {{ tool.maintainer }}</p>{% endif %}
</article>
