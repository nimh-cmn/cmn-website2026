<article class="publication-row publication-group-{{ publication.group|default('unknown') }}">
  <h5>
    {% if publication.url %}
    <a href="{{ publication.url }}">{{ publication.title }}</a>
    {% else %}
    {{ publication.title }}
    {% endif %}
  </h5>
  {% if publication.citation %}<p>{{ publication.citation }}</p>{% endif %}
</article>
