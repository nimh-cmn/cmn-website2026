{% extends "base.html" %}
{% block title %}{{ title }} | {{ SITENAME }}{% endblock %}
{% block content %}
<article class="page">
  <header class="page-header">
    <p class="eyebrow">{{ talk_month }}</p>
    <h1>{{ title }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
  {% if links %}
  <div class="link-list">
    {% for link in links %}
    <a href="{{ link.href }}">{{ link.label }}</a>
    {% endfor %}
  </div>
  {% endif %}
</article>
{% endblock %}
