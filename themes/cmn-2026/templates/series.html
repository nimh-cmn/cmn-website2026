{% extends "base.html" %}
{% block title %}Series | {{ SITENAME }}{% endblock %}
{% block content %}
<section class="page">
  <header class="page-header">
    <h1>Series</h1>
  </header>
  <div class="item-list">
    {% for series in series_list %}
    <article>
      <h2><a href="{{ SITEURL }}{{ series.url }}">{{ series.title }}</a></h2>
      <div class="prose">{{ series.content }}</div>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
