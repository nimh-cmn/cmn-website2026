{% extends "base.html" %}
{% block title %}Resources | {{ SITENAME }}{% endblock %}
{% block content %}
<section class="page">
  <header class="page-header">
    <h1>Resources</h1>
  </header>
  <div class="item-list">
    {% for resource in resources %}
    <article>
      <h2><a href="{{ SITEURL }}{{ resource.url }}">{{ resource.title }}</a></h2>
      <p>{{ resource.summary|striptags }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
